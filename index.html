<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Game</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#071a33;--card:#0f2f57;--line:#2c5a8c;--ink:#eef4ff;--muted:#9fb6d6;--gold:#f5c04a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Be Vietnam Pro','Segoe UI',Tahoma,Arial,sans-serif;
  background:radial-gradient(1000px 500px at 50% -10%,#1d4f8f,transparent 60%),var(--bg)}
main{max-width:960px;margin:auto;padding:40px 16px}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,44px);font-weight:800}
p.sub{margin:0 0 28px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:linear-gradient(180deg,#123764,#0b264a);border:1px solid var(--line);
  border-radius:14px;padding:20px;transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.card b{display:block;font-size:20px;margin-bottom:6px}
.card span{color:var(--muted);font-size:15px;line-height:1.5}
.card i{display:inline-block;margin-top:14px;color:var(--gold);font-style:normal;font-weight:800}
</style>
</head>
<body>
<main>
  <h1>Mini Game</h1>
  <p class="sub">Chọn một trò chơi để bắt đầu.</p>
  <div class="grid">
    <!-- Thêm game mới: copy một thẻ <a> bên dưới, đổi đường dẫn thư mục và tên -->
    <a class="card" href="olympia-vuot-chuong-ngai-vat/">
      <b>Olympia · Vượt chướng ngại vật</b>
      <span>4 hàng ngang ngẫu nhiên và câu hỏi từ khóa chủ đề lịch sử Việt Nam.</span>
      <i>Chơi ngay →</i>
    </a>
  </div>
</main>
</body>
</html>
